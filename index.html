<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!-- Theme before first paint (no flash): the stored choice, else the OS
         preference. Kept tiny and inline on purpose; src/lib/theme.ts owns
         runtime changes. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('theme');
          t = s === 'light' || s === 'dark' ? s : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4efe6');
      })();
    </script>
    <meta
      name="description"
      content="Nhlanhla &quot;Murci&quot; Mokoena — AI Engineer building production AI systems: agentic workflows, RAG architectures and end-to-end MLOps with LangChain, LangGraph and n8n, applied to XR simulation learning."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nhlanhla Mokoena — AI Engineer" />
    <meta
      property="og:description"
      content="Agentic AI, RAG & MLOps — shipped to production. Portfolio of Nhlanhla &quot;Murci&quot; Mokoena."
    />
    <!-- Absolute URLs required: crawlers do not resolve relative og:image
         paths, so link previews render blank without these. Update all four
         if the Vercel project is ever renamed (the subdomain follows it). -->
    <meta property="og:url" content="https://my-site-six-rose.vercel.app/" />
    <meta property="og:image" content="https://my-site-six-rose.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nhlanhla Mokoena — AI Engineer" />
    <meta
      name="twitter:description"
      content="Agentic AI, RAG & MLOps — shipped to production. Portfolio of Nhlanhla &quot;Murci&quot; Mokoena."
    />
    <meta name="twitter:image" content="https://my-site-six-rose.vercel.app/og.png" />
    <link rel="canonical" href="https://my-site-six-rose.vercel.app/" />
    <title>Nhlanhla Mokoena — AI Engineer</title>
  </head>
